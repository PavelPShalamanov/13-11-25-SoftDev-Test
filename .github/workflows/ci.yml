name: CI - Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx pytest-asyncio locust

      - name: Start FastAPI app in background
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5  # wait for server to start

      - name: Run unit tests
        run: |
          pytest -v tests/

      - name: Run Locust load test (headless, 10 user, 5 loop)
        run: |
          locust -f load_tests/locustfile.py --host http://127.0.0.1:8000 --headless -u 10 -r 5 -t 30s

